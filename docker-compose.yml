services:
  postgres:
    image: postgres:16-alpine
    container_name: grcplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grcplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grcplatform}
      POSTGRES_DB: ${POSTGRES_DB:-grcplatform}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grcplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: grcplatform-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-grcplatform}:${POSTGRES_PASSWORD:-grcplatform}@postgres:5432/${POSTGRES_DB:-grcplatform}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Sin valor por defecto a propósito: debe definirse en .env (ver .env.example).
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      EVIDENCE_STORAGE_PATH: ${EVIDENCE_STORAGE_PATH:-storage/evidence}
      MAX_EVIDENCE_FILE_SIZE_MB: ${MAX_EVIDENCE_FILE_SIZE_MB:-20}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: grcplatform-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  mcp:
    build: ./mcp
    container_name: grcplatform-mcp
    restart: unless-stopped
    environment:
      GRC_API_BASE_URL: http://backend:8000
      # Sin valor por defecto a propósito: credencial de integración real (ver .env.example).
      GRC_MCP_TOKEN: ${GRC_MCP_TOKEN}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_HTTP_PORT: ${MCP_HTTP_PORT:-8001}
    ports:
      - "${MCP_PORT:-8001}:8001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8001), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./mcp:/app

volumes:
  postgres_data:
