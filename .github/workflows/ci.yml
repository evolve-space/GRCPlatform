name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Solo lectura por defecto — ningún job de este pipeline necesita escribir
# en el repositorio ni en releases.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests, ruff, mypy, pip-audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: grcplatform
          POSTGRES_PASSWORD: grcplatform
          POSTGRES_DB: grcplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grcplatform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Solo para este job de CI, con una base de datos de test efímera del
      # propio runner — nunca apunta a un entorno real. Los tests crean
      # además su propia base "grcplatform_test" (ver tests/conftest.py).
      DATABASE_URL: postgresql+psycopg://grcplatform:grcplatform@localhost:5432/grcplatform
      SECRET_KEY: clave-de-ci-sin-valor-real-nunca-se-usa-en-produccion
      ENVIRONMENT: test
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Ruff
        working-directory: backend
        run: ruff check .

      - name: mypy
        working-directory: backend
        run: mypy app

      - name: pytest
        working-directory: backend
        run: pytest

      - name: pip-audit (informativo — no bloquea el pipeline)
        working-directory: backend
        run: pip-audit -r requirements.txt || true

  mcp:
    name: MCP (tests, ruff, mypy)
    runs-on: ubuntu-latest
    env:
      GRC_API_BASE_URL: http://localhost:8000
      GRC_MCP_TOKEN: grc_ci_token_no_es_una_credencial_real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: mcp/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: mcp
        run: pip install -r requirements-dev.txt

      - name: Ruff
        working-directory: mcp
        run: ruff check .

      - name: mypy
        working-directory: mcp
        run: mypy .

      - name: pytest
        working-directory: mcp
        run: pytest

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: npm audit (informativo — no bloquea el pipeline)
        working-directory: frontend
        run: npm audit --omit=dev || true

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest
    needs: [backend, mcp, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Construir todas las imágenes (dev)
        run: docker compose build

      - name: Construir la imagen de producción (nginx + frontend)
        run: docker compose -f docker-compose.prod.yml build nginx backend mcp
